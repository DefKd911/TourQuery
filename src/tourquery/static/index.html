<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TourQuery</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f8f6;
    --surface: #ffffff;
    --sidebar: #fbfcfa;
    --ink: #17201b;
    --muted: #66706a;
    --border: #e3e7e1;
    --accent: #1f6a43;        /* court green */
    --accent-ink: #ffffff;
    --accent-soft: #e8f2eb;
    --ball: #d6e43c;
    --clay: #c45a29;
    --hard: #2d5fa3;
    --amber-bg: #fbf0d9;
    --amber-ink: #87570a;
    --red-bg: #fbe5e1;
    --red-ink: #9a2b1e;
    --code-bg: #f4f6f3;
    --shadow: 0 1px 2px rgba(15, 30, 20, 0.04), 0 4px 14px rgba(15, 30, 20, 0.05);
    --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101412;
      --surface: #171c19;
      --sidebar: #131815;
      --ink: #e8ece9;
      --muted: #8f9a94;
      --border: #262d29;
      --accent: #6fbe8d;
      --accent-ink: #0d1a12;
      --accent-soft: #1b2820;
      --amber-bg: #2b2311;
      --amber-ink: #e6b85a;
      --red-bg: #2d1613;
      --red-ink: #ef9086;
      --code-bg: #121714;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
  button { font: inherit; color: inherit; }

  .app { display: grid; grid-template-columns: 270px 1fr; height: 100vh; }

  /* ------------------------------------------------------------- Sidebar */
  .sidebar {
    background: var(--sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; padding: 18px 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
  .ball-icon {
    width: 24px; height: 24px; border-radius: 50%; background: var(--ball);
    position: relative; overflow: hidden; flex-shrink: 0;
    box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.08);
  }
  .ball-icon::before, .ball-icon::after {
    content: ""; position: absolute; top: 0; width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.9);
  }
  .ball-icon::before { left: -16px; }
  .ball-icon::after { right: -16px; }
  .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .brand-tag { font-size: 12px; color: var(--muted); }

  .new-btn {
    width: 100%; padding: 9px 12px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); font-weight: 500; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .new-btn:hover { border-color: var(--accent); color: var(--accent); }

  .list-title { font-size: 12px; font-weight: 600; color: var(--muted); margin: 22px 8px 8px; }
  .threads { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
  .thread {
    display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 10px;
    margin-bottom: 2px; border-radius: 8px; cursor: pointer;
  }
  .thread:hover { background: var(--code-bg); }
  .thread.active { background: var(--accent-soft); }
  .thread-text { flex: 1; min-width: 0; }
  .thread-title { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread.active .thread-title { color: var(--accent); font-weight: 500; }
  .thread-time { font-size: 11.5px; color: var(--muted); }
  .thread-delete {
    border: none; background: none; cursor: pointer; color: var(--muted);
    font-size: 17px; line-height: 1; padding: 2px 5px; border-radius: 6px; opacity: 0;
  }
  .thread:hover .thread-delete, .thread.active .thread-delete { opacity: 1; }
  .thread-delete:hover { background: var(--border); color: var(--ink); }
  .threads-empty { font-size: 13px; color: var(--muted); padding: 0 8px; }

  /* ---------------------------------------------------------------- Main */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { display: none; }
  .scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .wrap { width: 100%; max-width: 780px; margin: 0 auto; padding: 0 24px; }
  .messages { padding-block: 32px 24px; }

  /* Empty state */
  .empty { text-align: center; padding-top: 8vh; }
  .empty .ball-icon { width: 44px; height: 44px; margin: 0 auto 18px; }
  .empty .ball-icon::before, .empty .ball-icon::after { width: 44px; height: 44px; border-width: 3px; }
  .empty .ball-icon::before { left: -29px; }
  .empty .ball-icon::after { right: -29px; }
  .empty h2 { font-size: 27px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
  .empty p { color: var(--muted); margin: 0 auto 28px; max-width: 460px; }
  .chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; }
  .chip {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; text-align: left;
  }
  .chip:hover { border-color: var(--accent); }
  .chip-tag {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 4px;
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .chip-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--accent)); }
  .chip-text { display: block; font-size: 14px; color: var(--ink); }

  /* Messages */
  .msg { margin-bottom: 20px; animation: rise 0.2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { display: flex; justify-content: flex-end; }
  .bubble {
    background: var(--accent); color: var(--accent-ink); max-width: 80%;
    padding: 9px 15px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; word-wrap: break-word;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .answer { margin: 0; white-space: pre-wrap; }
  .badge {
    display: inline-block; margin-bottom: 8px; padding: 2px 9px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .badge.refused { background: var(--amber-bg); color: var(--amber-ink); }
  .badge.failed { background: var(--red-bg); color: var(--red-ink); }

  details { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  summary {
    cursor: pointer; list-style: none; user-select: none; display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: var(--muted);
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "›"; font-size: 16px; transition: transform 0.15s; }
  details[open] summary::before { transform: rotate(90deg); }
  summary:hover { color: var(--accent); }
  pre.sql {
    margin: 10px 0 0; padding: 12px 14px; background: var(--code-bg); border-radius: 8px;
    font: 12.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word;
  }
  .table-wrap { margin-top: 10px; overflow: auto; max-height: 360px; border: 1px solid var(--border); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th { position: sticky; top: 0; background: var(--code-bg); color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .meta { margin-top: 12px; font-size: 12.5px; color: var(--muted); }

  /* Loading: a small bouncing tennis ball */
  .thinking { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; }
  .bounce { width: 18px; height: 26px; position: relative; flex-shrink: 0; }
  .bounce-ball {
    position: absolute; left: 2px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--ball); animation: bounce 0.8s cubic-bezier(.5, 0, .5, 1) infinite;
  }
  @keyframes bounce { 0%, 100% { top: 0; } 50% { top: 12px; } }

  /* Composer */
  .composer { flex-shrink: 0; padding-block: 10px 16px; }
  .composer form {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 7px 7px 7px 15px; box-shadow: var(--shadow);
  }
  .composer form:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; border: none; outline: none; resize: none; background: transparent; color: var(--ink);
    font: 15px/1.5 var(--body); padding: 7px 0; max-height: 140px;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    width: 38px; height: 38px; border: none; border-radius: 11px; cursor: pointer; flex-shrink: 0;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  }
  .send:disabled { opacity: 0.4; cursor: default; }
  .hint { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 7px; }

  /* ------------------------------------------------------------- Mobile */
  .backdrop { display: none; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 20;
      transform: translateX(-100%); transition: transform 0.2s ease;
    }
    .app.menu-open .sidebar { transform: none; }
    .app.menu-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 10; }
    .topbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .menu-btn { border: none; background: none; cursor: pointer; padding: 4px; display: grid; }
    .wrap { padding: 0 16px; }
    .chips { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" aria-label="Conversations">
    <div class="brand">
      <div class="ball-icon" aria-hidden="true"></div>
      <div>
        <div class="brand-name">TourQuery</div>
        <div class="brand-tag">ATP tennis data, 2023–2025</div>
      </div>
    </div>
    <button class="new-btn" id="new-chat" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New conversation
    </button>
    <div class="list-title">Recent</div>
    <ul class="threads" id="threads"></ul>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Open conversations">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="ball-icon" aria-hidden="true"></div>
      <div class="brand-name">TourQuery</div>
    </div>

    <div class="scroll" id="scroll">
      <div class="wrap messages" id="messages"></div>
    </div>

    <div class="composer">
      <div class="wrap">
        <form id="form">
          <textarea id="input" rows="1" maxlength="500" placeholder="Ask about players, matches or rankings…"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
        <div class="hint">Enter to send · Shift+Enter for a new line · Answers take about 20–40 seconds</div>
      </div>
    </div>
  </div>
</div>

<template id="empty-template">
  <section class="empty">
    <div class="ball-icon" aria-hidden="true"></div>
    <h2>Ask anything about ATP tennis</h2>
    <p>Questions are turned into SQL, checked for safety, and run on real match data from 2023–2025. Follow-up questions work too.</p>
    <div class="chips">
      <button class="chip" type="button" style="--dot: var(--accent)"><span class="chip-tag">Rankings</span><span class="chip-text">Who are the top 5 players by match wins in 2024?</span></button>
      <button class="chip" type="button" style="--dot: var(--hard)"><span class="chip-tag">Head-to-head</span><span class="chip-text">What's the head-to-head between Alcaraz and Sinner?</span></button>
      <button class="chip" type="button" style="--dot: var(--ball)"><span class="chip-tag">Trend</span><span class="chip-text">Show Jannik Sinner's ranking trend over 2024</span></button>
      <button class="chip" type="button" style="--dot: var(--clay)"><span class="chip-tag">Clay</span><span class="chip-text">Who won the most matches on clay in 2025?</span></button>
    </div>
  </section>
</template>

<script>
  const STORAGE_THREADS = "tourquery.threads";
  const STORAGE_ACTIVE = "tourquery.active";
  const MAX_TABLE_ROWS = 100;

  const app = document.getElementById("app");
  const messages = document.getElementById("messages");
  const scroller = document.getElementById("scroll");
  const threadList = document.getElementById("threads");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  let activeThreadId = null;
  let busy = false;

  // ---------------------------------------------------------------- Helpers

  // Builds an element. Text is always set via textContent, never parsed as HTML.
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function scrollToBottom() {
    scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" });
  }

  function describeHttpError(status) {
    if (status === 422) return "That message couldn't be read. Try rephrasing it (up to 500 characters).";
    if (status >= 500) return "The server ran into an error answering that. Please try again.";
    return `Unexpected response from the server (${status}). Please try again.`;
  }

  function timeAgo(timestamp) {
    const minutes = Math.round((Date.now() - timestamp) / 60000);
    if (minutes < 1) return "just now";
    if (minutes < 60) return `${minutes} min ago`;
    const hours = Math.round(minutes / 60);
    if (hours < 24) return `${hours} h ago`;
    return `${Math.round(hours / 24)} d ago`;
  }

  // ------------------------------------------------- Saved conversations (this browser)

  function loadThreads() {
    try { return JSON.parse(localStorage.getItem(STORAGE_THREADS)) || []; }
    catch { return []; }
  }

  function saveThreads(threads) {
    try { localStorage.setItem(STORAGE_THREADS, JSON.stringify(threads)); } catch {}
  }

  function setActive(id) {
    activeThreadId = id;
    try { id ? localStorage.setItem(STORAGE_ACTIVE, id) : localStorage.removeItem(STORAGE_ACTIVE); } catch {}
    renderThreadList();
  }

  function rememberThread(id, firstQuestion) {
    const threads = loadThreads();
    const existing = threads.find((t) => t.id === id);
    if (existing) existing.updatedAt = Date.now();
    else threads.push({ id, title: firstQuestion, updatedAt: Date.now() });
    saveThreads(threads);
  }

  function forgetThread(id) {
    saveThreads(loadThreads().filter((t) => t.id !== id));
    if (id === activeThreadId) startNewConversation();
    else renderThreadList();
  }

  function renderThreadList() {
    threadList.replaceChildren();
    const threads = loadThreads().sort((a, b) => b.updatedAt - a.updatedAt);
    if (!threads.length) {
      threadList.appendChild(el("li", "threads-empty", "Your conversations will appear here."));
      return;
    }
    for (const thread of threads) {
      const item = el("li", "thread" + (thread.id === activeThreadId ? " active" : ""));
      const text = el("div", "thread-text");
      text.append(el("div", "thread-title", thread.title), el("div", "thread-time", timeAgo(thread.updatedAt)));
      const del = el("button", "thread-delete", "×");
      del.type = "button";
      del.title = "Remove from this list";
      del.addEventListener("click", (e) => { e.stopPropagation(); forgetThread(thread.id); });
      item.append(text, del);
      item.addEventListener("click", () => openConversation(thread.id));
      threadList.appendChild(item);
    }
  }

  // ---------------------------------------------------------------- Rendering

  function showEmptyState() {
    messages.replaceChildren(document.getElementById("empty-template").content.cloneNode(true));
    messages.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => ask(chip.querySelector(".chip-text").textContent));
    });
  }

  function addUserMessage(text) {
    const msg = el("div", "msg user");
    msg.appendChild(el("div", "bubble", text));
    messages.appendChild(msg);
  }

  function addLoader() {
    const msg = el("div", "msg");
    const card = el("div", "card thinking");
    const bounce = el("div", "bounce");
    bounce.appendChild(el("div", "bounce-ball"));
    card.append(bounce, el("span", null, "Finding the right tables and writing SQL…"));
    msg.appendChild(card);
    messages.appendChild(msg);
    return msg;
  }

  function buildTable(columns, rows) {
    const wrap = el("div");
    const tableWrap = el("div", "table-wrap");
    const table = el("table");
    const headRow = el("tr");
    columns.forEach((c) => headRow.appendChild(el("th", null, c.replaceAll("_", " "))));
    table.appendChild(el("thead")).appendChild(headRow);
    const body = el("tbody");
    for (const row of rows.slice(0, MAX_TABLE_ROWS)) {
      const tr = el("tr");
      for (const value of row) {
        tr.appendChild(el("td", typeof value === "number" ? "num" : null, value === null ? "—" : String(value)));
      }
      body.appendChild(tr);
    }
    table.appendChild(body);
    tableWrap.appendChild(table);
    wrap.appendChild(tableWrap);
    if (rows.length > MAX_TABLE_ROWS) {
      wrap.appendChild(el("div", "table-note", `Showing the first ${MAX_TABLE_ROWS} of ${rows.length} rows.`));
    }
    return wrap;
  }

  // `result` is either a live answer from POST /ask, or a saved turn from GET /threads/{id}.
  function addAnswer(result, { saved = false } = {}) {
    const msg = el("div", "msg");
    const card = el("div", "card");

    if (result.status === "refused") card.appendChild(el("span", "badge refused", "Can't do that"));
    if (result.status === "failed") card.appendChild(el("span", "badge failed", "Couldn't answer"));
    card.appendChild(el("p", "answer", result.answer));

    if (result.sql) {
      const details = el("details");
      details.append(el("summary", null, "SQL used"), el("pre", "sql", result.sql));
      card.appendChild(details);
    }
    if (result.columns && result.columns.length) {
      const n = result.rows.length;
      const details = el("details");
      details.append(el("summary", null, `Data (${n} row${n === 1 ? "" : "s"})`), buildTable(result.columns, result.rows));
      card.appendChild(details);
    }

    if (saved && result.sql) {
      card.appendChild(el("div", "meta", "Saved answer · ask again to see the data table"));
    } else if (result.duration_ms) {
      card.appendChild(el("div", "meta", `Answered in ${(result.duration_ms / 1000).toFixed(1)}s`));
    }

    msg.appendChild(card);
    messages.appendChild(msg);
  }

  // ---------------------------------------------------------------- Actions

  function startNewConversation() {
    setActive(null);
    showEmptyState();
    app.classList.remove("menu-open");
    input.focus();
  }

  async function openConversation(id) {
    app.classList.remove("menu-open");
    setActive(id);
    messages.replaceChildren();
    try {
      const response = await fetch(`/threads/${encodeURIComponent(id)}`);
      const turns = response.ok ? await response.json() : [];
      if (!turns.length) {
        forgetThread(id);  // e.g. the server's memory was cleared
        return;
      }
      for (const turn of turns) {
        addUserMessage(turn.question);
        addAnswer(turn, { saved: true });
      }
      scroller.scrollTop = scroller.scrollHeight;
    } catch (err) {
      console.error(err);
      addAnswer({ status: "failed", answer: "Couldn't load this conversation. Is the server running?" }, { saved: true });
    }
  }

  async function ask(question) {
    question = question.trim();
    if (busy || !question) return;
    busy = true;
    sendBtn.disabled = true;
    if (messages.querySelector(".empty")) messages.replaceChildren();

    addUserMessage(question);
    const loader = addLoader();
    scrollToBottom();

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, thread_id: activeThreadId }),
      });
      loader.remove();
      if (!response.ok) {
        addAnswer({ status: "failed", answer: describeHttpError(response.status) });
        return;
      }
      const result = await response.json();
      addAnswer(result);
      rememberThread(result.thread_id, question);
      setActive(result.thread_id);
    } catch (err) {
      console.error(err);
      loader.remove();
      addAnswer({
        status: "failed",
        answer: "Couldn't reach the server. Check your connection and try again. (On the free plan the server sleeps when idle and takes about a minute to wake up.)",
      });
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
      scrollToBottom();
    }
  }

  // ---------------------------------------------------------------- Wiring

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const question = input.value;
    input.value = "";
    input.style.height = "auto";
    ask(question);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });
  document.getElementById("new-chat").addEventListener("click", startNewConversation);
  document.getElementById("menu-btn").addEventListener("click", () => app.classList.add("menu-open"));
  document.getElementById("backdrop").addEventListener("click", () => app.classList.remove("menu-open"));

  // On load: reopen the last conversation, or show the welcome screen.
  let lastActive = null;
  try { lastActive = localStorage.getItem(STORAGE_ACTIVE); } catch {}
  if (lastActive && loadThreads().some((t) => t.id === lastActive)) openConversation(lastActive);
  else startNewConversation();
</script>
</body>
</html>
